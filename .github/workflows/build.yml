name: Build IPA
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          printf 'APP_DISPLAY_NAME = Aether Chat\nPRODUCT_BUNDLE_IDENTIFIER = com.aether.chat\n' > Local.xcconfig
          xcodebuild -project WhatsAppWeb.xcodeproj -scheme WhatsAppWeb \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r AetherChat.ipa Payload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          files: AetherChat.ipa
